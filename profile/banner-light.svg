<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" font-family="Inter,'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131313"/>
      <stop offset="1" stop-color="#353534"/>
    </linearGradient>
    <linearGradient id="borderShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#131313" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#e10100" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#131313" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10100" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e10100" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#e10100" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1180" height="580" rx="24" fill="#f8f7f6"/>
  <circle cx="120" cy="80" r="280" fill="#e10100" opacity="0.06"/>
  <circle cx="1000" cy="480" r="300" fill="#ffb4a8" opacity="0.03"/>
  <rect width="1180" height="580" rx="24" fill="none" stroke="url(#borderShine)" stroke-width="1.2"/>

  <!-- LEFT PANEL -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="6s" repeatCount="indefinite"/>
    <rect x="48" y="40" width="420" height="500" rx="18" fill="#ffffff" stroke="#131313" stroke-opacity="0.06" stroke-width="1"/>

    <!-- HEADER -->
    <text x="258" y="80" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" letter-spacing="3" fill="#8f8c89">EVENLIO OS — BOOT SEQUENCE</text>
    <rect x="66" y="94" width="384" height="1" fill="#131313" fill-opacity="0.04"/>

    <!-- BIG EVENLIO TEXT -->
    <text x="258" y="210" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="64" font-weight="900" letter-spacing="-0.03em" fill="url(#titleGrad)">EVENLIO</text>

    <!-- SUBTITLE -->
    <text x="258" y="248" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#8f8c89">THE EVENT OPERATING SYSTEM</text>

    <!-- DECORATIVE LINE -->
    <rect x="140" y="270" width="236" height="1" fill="url(#scanGrad)" opacity="0.5"/>

    <!-- STATUS BLOCK -->
    <text x="74" y="310" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#8f8c89">&gt; system boot <tspan fill="#e10100">complete</tspan></text>
    <text x="74" y="332" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#8f8c89">&gt; all engines <tspan fill="#e10100">online</tspan></text>
    <text x="74" y="354" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#8f8c89">&gt; ready for <tspan fill="#e10100">deployment</tspan></text>

    <!-- CURSOR -->
    <rect x="344" y="342" width="8" height="14" fill="#e10100">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- PRODUCTION CHIP -->
    <circle cx="82" cy="420" r="4" fill="#e10100">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="96" y="425" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#353534">PRODUCTION</text>

    <!-- VERSION -->
    <text x="74" y="470" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#8f8c89">v1.0.0 · laravel 11 · php 8.3</text>
  </g>

  <!-- RIGHT PANEL -->
  <rect x="496" y="40" width="636" height="500" rx="18" fill="#ffffff" stroke="#131313" stroke-opacity="0.06" stroke-width="1"/>
  <path d="M496 58 C496 46 505 40 517 40 L1111 40 C1123 40 1132 46 1132 58 L1132 72 L496 72 Z" fill="#f0efed"/>
  <circle cx="520" cy="56" r="5.5" fill="#e10100"/>
  <circle cx="540" cy="56" r="5.5" fill="#e5e2e1"/>
  <circle cx="560" cy="56" r="5.5" fill="#e5e2e1"/>
  <text x="814" y="61" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#8f8c89">evenlio — event-os</text>

  <!-- WHOAMI -->
  <text x="528" y="108" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#8f8c89">$ whoami</text>
  <text x="528" y="155" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-0.02em" fill="#131313">EVENLIO</text>
  <rect x="528" y="168" width="4" height="28" fill="#e10100">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- TAGLINE -->
  <text x="528" y="215" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="500" fill="#353534">The <tspan fill="#e10100" font-weight="700">Event Operating System</tspan></text>
  <text x="528" y="238" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="14" fill="#8f8c89">owned &amp; built by <tspan fill="#131313">Evenlio</tspan></text>

  <!-- DIVIDER -->
  <rect x="528" y="262" width="572" height="1" fill="#131313" fill-opacity="0.04"/>

  <!-- WHAT WE BUILD -->
  <text x="528" y="292" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#e10100">WHAT WE BUILD</text>
  <text x="528" y="318" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#8f8c89">&gt; <tspan fill="#353534">ticketing · check-in · access control</tspan></text>
  <text x="528" y="340" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#8f8c89">&gt; <tspan fill="#353534">organizer &amp; exhibitor platforms</tspan></text>
  <text x="528" y="362" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#8f8c89">&gt; <tspan fill="#353534">esports · clubs · AR experiences</tspan></text>
  <text x="528" y="384" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#8f8c89">&gt; <tspan fill="#353534">multi-language · global-ready</tspan></text>

  <!-- DIVIDER -->
  <rect x="528" y="408" width="572" height="1" fill="#131313" fill-opacity="0.04"/>

  <!-- TECH PILLS -->
  <g font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600">
    <g transform="translate(528,424)"><rect width="74" height="26" rx="13" fill="#f0efed"/><text x="37" y="18" text-anchor="middle" fill="#353534">Laravel</text></g>
    <g transform="translate(610,424)"><rect width="74" height="26" rx="13" fill="#f0efed"/><text x="37" y="18" text-anchor="middle" fill="#353534">PHP 8.3</text></g>
    <g transform="translate(692,424)"><rect width="78" height="26" rx="13" fill="#f0efed"/><text x="39" y="18" text-anchor="middle" fill="#353534">MySQL 8</text></g>
    <g transform="translate(778,424)"><rect width="66" height="26" rx="13" fill="#f0efed"/><text x="33" y="18" text-anchor="middle" fill="#353534">Blade</text></g>
    <g transform="translate(852,424)"><rect width="86" height="26" rx="13" fill="#f0efed"/><text x="43" y="18" text-anchor="middle" fill="#353534">Bootstrap</text></g>
    <g transform="translate(946,424)"><rect width="66" height="26" rx="13" fill="#f0efed"/><text x="33" y="18" text-anchor="middle" fill="#353534">jQuery</text></g>
    <g transform="translate(1020,424)"><rect width="84" height="26" rx="13" fill="#f0efed"/><text x="42" y="18" text-anchor="middle" fill="#353534">AR / 3D</text></g>
  </g>

  <!-- DIVIDER -->
  <rect x="528" y="464" width="572" height="1" fill="#131313" fill-opacity="0.04"/>

  <!-- FOOTER -->
  <circle cx="544" cy="496" r="14" fill="#f0efed"/>
  <circle cx="544" cy="496" r="5.5" fill="none" stroke="#e10100" stroke-width="1.2"/>
  <ellipse cx="544" cy="496" rx="2.5" ry="5.5" fill="none" stroke="#e10100" stroke-width="1"/>
  <path d="M539 496 h10 M544 491 v10" stroke="#e10100" stroke-width="1" fill="none"/>

  <circle cx="580" cy="496" r="14" fill="#f0efed"/>
  <rect x="574" y="490" width="12" height="9" rx="1.5" fill="none" stroke="#e10100" stroke-width="1.2"/>
  <path d="M574 491 L580 496 L586 491" fill="none" stroke="#e10100" stroke-width="1.2"/>

  <circle cx="616" cy="496" r="14" fill="#f0efed"/>
  <path d="M611 496 l3 -5 l3 5 M617 496 l3 -5 l3 5 M614 495 l2 6" fill="none" stroke="#e10100" stroke-width="1.2" stroke-linecap="round"/>

  <text x="650" y="501" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#353534">evenlio.com<tspan fill="#8f8c89"> · </tspan><tspan fill="#e10100">contact@evenlio.com</tspan></text>
</svg>
